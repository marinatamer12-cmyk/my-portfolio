<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marina - Graphic Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#f2f0ea;color:#1a1a1a}
nav{display:flex;justify-content:space-between;align-items:center;padding:25px 6%;background:#f2f0ea;border-bottom:1px solid #ddd;font-weight:700}
nav .links{display:flex;gap:20px;font-size:16px}
nav .logo{font-size:24px;font-weight:900}
nav .logo span{color:#ff4d1a}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:30px;padding:8px 18px;background:white;font-size:14px;margin:30px 6% 0 0}
.dot{width:10px;height:10px;background:#ff4d1a;border-radius:50%}
.hero{padding:30px 6% 60px}
.hero h1{font-size:52px;line-height:1.1;font-weight:900;max-width:600px}
.hero h1 .orange{color:#ff4d1a}
.hero p{margin-top:25px;color:#555;font-size:18px;line-height:1.8;max-width:520px}
.tags{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px}
.tag{padding:10px 18px;border-radius:12px;font-weight:700;font-size:15px}
.tag-orange{background:#ffe4d6;color:#ff4d1a}
.tag-purple{background:#e8e2ff;color:#4b3a8a}
.tag-white{background:white;border:1px solid #ddd}
@media(max-width:600px){.hero h1{font-size:38px}}
</style>
</head>
<body>
<nav>
<div class="logo"><span>.</span>Marina</div>
<div class="links">
<span>الأعمال</span>
<span>نبذة</span>
<span>تواصل</span>
</div>
</nav>

<div class="badge"><span class="dot"></span> متاحة لمشاريع جديدة</div>

<div class="hero">
<h1>بصمّم محتوى<br><span class="orange">بصري</span> بيحكي<br>حكاية <span class="orange">براندك</span></h1>
<p>
مصممة جرافيك متخصصة في محتوى السوشيال ميديا والموشن — من الريلز والستوريز لهوية الصفحة بالكامل، بأسلوب واضح ومتسق يخلي البراند يفضل في دماغ العميل.
</p>
<div class="tags">
<span class="tag tag-orange">فيديو وموشن</span>
<span class="tag tag-purple">بوستات وهوية</span>
<span class="tag tag-white">11 مشروع منجز</span>
</div>
</div>
</body>
</html>
